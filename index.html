    <style>

            --tg-theme-bg-color: #ffffff;
            --tg-theme-secondary-bg-color: #f4f4f5;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #8e8e93;
            --tg-theme-link-color: #2AABEE;
            --tg-theme-button-color: #2AABEE;
            --tg-theme-button-text-color: #ffffff;
        }
        :root {
            --bg: var(--tg-theme-bg-color);
            --bg2: var(--tg-theme-secondary-bg-color);
            --text: var(--tg-theme-text-color);
            --hint: var(--tg-theme-hint-color);
            --accent: var(--tg-theme-button-color);
            --accent-light: rgba(42, 171, 238, 0.12);
            --btn-text: var(--tg-theme-button-text-color);
            --green: #34C759;
            --green-light: rgba(52, 199, 89, 0.12);
            --orange: #FF9500;
            --orange-light: rgba(255, 149, 0, 0.12);
            --red: #FF3B30;
            --purple: #AF52DE;
            --radius: 16px;
            --radius-sm: 12px;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; background: var(--bg2); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
    </style>
</head>

    <div class="tabs" id="tabs"></div>
    <div id="overview" class="tab-content active"></div>
    <div id="leaderboard" class="tab-content"></div>
    <div id="calendar" class="tab-content"></div>
    <div id="achievements" class="tab-content"></div>
    <div class="loader" id="loader"><div class="spinner"></div><div class="loader-text">Загрузка данных...</div></div>

    .cal-day.profit.high { background: var(--accent); color: white; }
    .cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
    
    /* Streak Card */
    .streak-card { display: flex; align-items: center; gap: 16px; padding: 20px; background: linear-gradient(135deg, #FF9500 0%, #FF6B00 100%); border-radius: var(--radius); margin: 16px; color: #fff; box-shadow: 0 4px 20px rgba(255, 149, 0, 0.3); }
    .streak-icon { width: 56px; height: 56px; background: rgba(255,255,255,0.2); border-radius: 16px; display: flex; align-items: center; justify-content: center; }

    .streak-content { flex: 1; }

    .streak-lbl { font-size: 14px; opacity: 0.9; margin-top: 2px; }

    .ach-icon.done { background: linear-gradient(135deg, var(--accent), #1E96D1); }
    .ach-icon.locked { background: var(--bg2); }
    .ach-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .ach-desc { font-size: 12px; color: var(--hint); margin-bottom: 10px; }

    .ach-status { font-size: 11px; font-weight: 600; margin-top: 8px; }
    .ach-status.done { color: var(--green); }

    .summary-card { background: var(--bg); border-radius: var(--radius); margin: 16px; padding: 20px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow); }
    .summary-icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--accent), #1E96D1); border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .summary-icon svg { width: 28px; height: 28px; color: #fff; }
    .summary-content { flex: 1; }
    .summary-val { font-size: 28px; font-weight: 700; }
    .summary-lbl { font-size: 14px; color: var(--hint); margin-top: 2px; }
    
    /* Tab Content */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* Loader */
    .loader { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .loader.hidden { display: none; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--bg2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 15px; color: var(--hint); }
    
    /* Empty State */
    .empty { text-align: center; padding: 60px 20px; }
    .empty-icon { width: 80px; height: 80px; margin: 0 auto 20px; background: var(--bg2); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .empty-icon svg { width: 40px; height: 40px; color: var(--hint); }
    .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .empty-text { font-size: 14px; color: var(--hint); max-width: 260px; margin: 0 auto; }

        // Добавлен range, чтобы загружать больше 1000 строк
        const [pRes, uRes] = await Promise.all([
            db.from('profits').select('*').order('created_at', {ascending: false}).range(0, 20000),
            db.from('users').select('*').eq('status', 'active').range(0, 10000)
        ]);
        
        allProfits = pRes.data || [];
        allUsers = uRes.data || [];
        userProfits = userId ? allProfits.filter(p => p.worker_id == userId) : [];
        currentUser = userId ? allUsers.find(u => u.id == userId) : null;
        
        // Render header
        const avatarHtml = userPhoto 
            ? `<img src="${userPhoto}" alt="">` 
            : ICONS.users;
        const displayName = currentUser?.full_name || userName || 'Пользователь';
        
        document.getElementById('header').innerHTML = `
            <div class="header-avatar">${avatarHtml}</div>
            <div class="header-info">
                <div class="header-title">${displayName}</div>
                <div class="header-sub">
                    <span>Аналитика команды</span>
                    <span class="header-badge">IRL Team</span>
                </div>
            </div>
        `;
        
        document.getElementById('loader').classList.add('hidden');
        renderAll();
    }
    
    function renderAll() { 
        renderOverview(); 
        renderLeaderboard(); 
        renderCalendar(); 
        renderAchievements(); 
    }
    
    function renderOverview() {
        const teamTotal = sum(allProfits);
        const todayProfits = allProfits.filter(p => isSameDay(new Date(p.created_at), new Date()));
        const teamToday = sum(todayProfits);
        const myTotal = sum(userProfits);
        const myToday = sum(userProfits.filter(p => isSameDay(new Date(p.created_at), new Date())));
        
        // Calculate rank
        const userMap = {};
        allProfits.forEach(p => userMap[p.worker_id] = (userMap[p.worker_id]||0) + (parseFloat(p.amount)||parseFloat(p.net_profit)||0));
        const rank = Object.entries(userMap).sort((a,b) => b[1]-a[1]).findIndex(x => x[0] == userId) + 1;
        
        // Week data for chart
        const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
        const chartLabels = [];
        const chartData = [];
        const teamChartData = [];
        
        for(let i=6; i>=0; i--) {
            const d = new Date(); d.setDate(d.getDate() - i);
            chartLabels.push(days[d.getDay()]);
            chartData.push(sum(userProfits.filter(p => isSameDay(new Date(p.created_at), d))));
            teamChartData.push(sum(allProfits.filter(p => isSameDay(new Date(p.created_at), d))));
        }
        
        // Service breakdown for pie chart
        const serviceMap = {};
        userProfits.forEach(p => serviceMap[p.service_name] = (serviceMap[p.service_name]||0) + (parseFloat(p.amount)||parseFloat(p.net_profit)||0));
        const serviceData = Object.entries(serviceMap).sort((a,b) => b[1]-a[1]).slice(0, 5);
        
        document.getElementById('overview').innerHTML = `
            <div class="stats-card">
                <div class="stats-label">${ICONS.wallet} Профит команды</div>
                <div class="stats-amount">${fmt(teamTotal)}</div>
                <div class="stats-row">
                    <div class="stats-item">
                        <div class="stats-item-val">${fmtShort(teamToday)}</div>
                        <div class="stats-item-lbl">Сегодня</div>
                    </div>
                    <div class="stats-item">
                        <div class="stats-item-val">${allUsers.length}</div>
                        <div class="stats-item-lbl">Воркеров</div>
                    </div>
                    <div class="stats-item">
                        <div class="stats-item-val">${allProfits.length}</div>
                        <div class="stats-item-lbl">Профитов</div>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">Моя статистика</div>
                <div class="card">
                    <div class="stat-grid">
                        <div class="stat-box">
                            <div class="stat-box-icon blue">${ICONS.wallet}</div>
                            <div class="stat-box-val">${fmtShort(myTotal)}</div>
                            <div class="stat-box-lbl">Всего (100%)</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-box-icon green">${ICONS.trending}</div>
                            <div class="stat-box-val">${userProfits.length}</div>
                            <div class="stat-box-lbl">Профитов</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-box-icon orange">${ICONS.clock}</div>
                            <div class="stat-box-val">${fmtShort(myToday)}</div>
                            <div class="stat-box-lbl">Сегодня</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-box-icon purple">${ICONS.trophy}</div>
                            <div class="stat-box-val">#${rank || '—'}</div>
                            <div class="stat-box-lbl">Позиция в топе</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">Динамика за неделю</div>
                <div class="card">
                    <div class="chart-container">
                        <canvas id="weekChart"></canvas>
                    </div>
                    <div class="chart-legend">
                        <div class="legend-item"><div class="legend-dot" style="background: var(--accent)"></div> Мои профиты</div>
                        <div class="legend-item"><div class="legend-dot" style="background: var(--green)"></div> Команда</div>
                    </div>
                </div>
            </div>
            
            ${serviceData.length ? `
            <div class="section">
                <div class="section-title">По сервисам</div>
                <div class="card">
                    <div class="chart-container" style="height: 200px;">
                        <canvas id="serviceChart"></canvas>
                    </div>
                </div>
            </div>` : ''}
        `;
        
        // Render charts
        setTimeout(() => {
            renderWeekChart(chartLabels, chartData, teamChartData);
            if (serviceData.length) renderServiceChart(serviceData);
        }, 100);
    }

    function renderWeekChart(labels, userData, teamData) {
        const ctx = document.getElementById('weekChart');
        if (!ctx) return;
        
        if (weekChart) weekChart.destroy();
        
        const maxTeam = Math.max(...teamData);
        const scaledTeam = teamData.map(v => maxTeam > 0 ? (v / maxTeam) * Math.max(...userData, 1) * 0.5 : 0);
        
        weekChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Мои профиты',
                    data: userData,
                    backgroundColor: 'rgba(42, 171, 238, 0.8)',
                    borderRadius: 8,
                    borderSkipped: false,
                }, {
                    label: 'Команда',
                    data: teamData,
                    backgroundColor: 'rgba(52, 199, 89, 0.3)',
                    borderRadius: 8,
                    borderSkipped: false,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#8e8e93', font: { size: 12 } } },
                    y: { display: false }
                }
            }
        });
    }
    
    function renderServiceChart(data) {
        const ctx = document.getElementById('serviceChart');
        if (!ctx) return;
        
        const colors = ['#2AABEE', '#34C759', '#FF9500', '#AF52DE', '#FF3B30'];
        
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: data.map(d => d[0]),
                datasets: [{
                    data: data.map(d => d[1]),
                    backgroundColor: colors.slice(0, data.length),
                    borderWidth: 0,
                    spacing: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '65%',
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { 
                            boxWidth: 12, 
                            padding: 12,
                            font: { size: 12 },
                            color: '#8e8e93'
                        }
                    }
                }
            }
        });
    }
    
    function renderLeaderboard() {
        let data = allProfits;
        const now = new Date();
        
        if (lbFilter === 'month') data = data.filter(p => new Date(p.created_at).getMonth() === now.getMonth() && new Date(p.created_at).getFullYear() === now.getFullYear());
        else if (lbFilter === 'week') data = data.filter(p => new Date(p.created_at) >= new Date(now.getTime() - 7*24*60*60*1000));
        else if (lbFilter === 'day') data = data.filter(p => isSameDay(new Date(p.created_at), now));
        
        const totals = {};
        data.forEach(p => totals[p.worker_id] = (totals[p.worker_id]||0) + (parseFloat(p.amount)||parseFloat(p.net_profit)||0));
        const sorted = Object.entries(totals)
            .map(([id, val]) => ({ id, val, user: allUsers.find(u => u.id == id) }))
            .sort((a,b) => b.val - a.val)
            .slice(0, 20);
        
        const filterLabels = { all: 'Всё время', month: 'Месяц', week: 'Неделя', day: 'Сегодня' };
        
        let html = `
            <div class="section" style="margin-top: 16px;">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">${ICONS.trophy} Рейтинг воркеров</div>
                        <select class="filter-select" onchange="lbFilter=this.value;renderLeaderboard()">
                            <option value="all" ${lbFilter=='all'?'selected':''}>Всё время</option>
                            <option value="month" ${lbFilter=='month'?'selected':''}>Месяц</option>
                            <option value="week" ${lbFilter=='week'?'selected':''}>Неделя</option>
                            <option value="day" ${lbFilter=='day'?'selected':''}>Сегодня</option>
                        </select>
                    </div>
                    <div class="list">`;
        
        if (sorted.length === 0) {
            html += `<div class="empty"><div class="empty-text">Нет данных</div></div>`;
        } else {
            sorted.forEach((item, idx) => {
                const rank = idx + 1;
                const rClass = rank <= 3 ? `rank-${rank}` : '';
                const u = item.user;
                const name = u?.full_name || 'Неизвестный';
                const avatar = u?.photo_url 
                    ? `<img src="${u.photo_url}">` 
                    : getInitials(name);
                
                html += `
                    <div class="list-item">
                        <div class="rank-badge ${rClass}">${rank}</div>
                        <div class="avatar">${avatar}</div>
                        <div class="user-info">
                            <div class="user-name">${name} ${rank===1 ? '👑':''}</div>
                            <div class="user-sub">${fmtShort(item.val)}</div>
                        </div>
                    </div>
                `;
            });
        }
        
        html += `</div></div></div>`;
        document.getElementById('leaderboard').innerHTML = html;
    }

    function renderCalendar() {
        const y = calMonth.getFullYear(), m = calMonth.getMonth();
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
        
        // Calculate daily profits
        const daily = {};
        userProfits.forEach(p => {
            const d = new Date(p.created_at);
            if (d.getMonth() === m && d.getFullYear() === y) {
                const day = d.getDate();
                daily[day] = (daily[day] || 0) + (parseFloat(p.amount) || parseFloat(p.net_profit) || 0);
            }
        });
        
        let html = `
            <div class="cal-card">
                <div class="cal-nav">
                    <button class="cal-btn" onclick="changeMonth(-1)">${ICONS.chevronLeft}</button>
                    <div class="cal-title">${monthNames[m]} ${y}</div>
                    <button class="cal-btn" onclick="changeMonth(1)">${ICONS.chevronRight}</button>
                </div>
                <div class="cal-grid">
                    ${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<div class="cal-head">${d}</div>`).join('')}
        `;
        
        const offset = firstDay === 0 ? 6 : firstDay - 1;
        for (let i = 0; i < offset; i++) html += `<div class="cal-day empty"></div>`;
        
        const maxVal = Math.max(...Object.values(daily), 1);
        const today = new Date();
        
        for (let d = 1; d <= daysInMonth; d++) {
            const val = daily[d] || 0;
            let cls = 'cal-day';
            if (val > 0) cls += ' profit';
            if (val > maxVal * 0.7) cls += ' high';
            if (isSameDay(new Date(y, m, d), today)) cls += ' today';
            
            html += `<div class="${cls}">${d}</div>`;
        }
        
        html += `</div></div>`;
        
        // Streak calculation
        let streak = 0;
        let tempDate = new Date();
        while (true) {
            const hasProfit = userProfits.some(p => isSameDay(new Date(p.created_at), tempDate));
            if (hasProfit) streak++;
            else if (!isSameDay(tempDate, new Date())) break; 
            tempDate.setDate(tempDate.getDate() - 1);
        }

        html += `
            <div class="streak-card">
                <div class="streak-icon">${ICONS.fire}</div>
                <div class="streak-content">
                    <div class="streak-val">${streak} ${getPlural(streak, ['день','дня','дней'])}</div>
                    <div class="streak-lbl">Текущая серия профитов</div>
                </div>
            </div>
        `;

        document.getElementById('calendar').innerHTML = html;
    }

    function changeMonth(delta) {
        calMonth.setMonth(calMonth.getMonth() + delta);
        renderCalendar();
    }

    function renderAchievements() {
        const totalProfit = sum(userProfits);
        const count = userProfits.length;
        
        // Recalculate streak logic strictly
        const profitDates = [...new Set(userProfits.map(p => new Date(p.created_at).toDateString()))].map(d => new Date(d)).sort((a,b) => b-a);
        let maxStreak = 0, curStreak = 0, lastDate = null;
        
        if (profitDates.length > 0) {
            curStreak = 1;
            lastDate = profitDates[0];
            maxStreak = 1;
            
            for (let i = 1; i < profitDates.length; i++) {
                const diff = (lastDate - profitDates[i]) / (1000 * 60 * 60 * 24);
                if (diff === 1) {
                    curStreak++;
                } else {
                    curStreak = 1;
                }
                if (curStreak > maxStreak) maxStreak = curStreak;
                lastDate = profitDates[i];
            }
        }

        let html = `<div class="ach-grid" style="margin-top: 16px;">`;
        
        ACHIEVEMENTS.forEach(ach => {
            let progress = 0;
            if (ach.isMoney) progress = Math.min(100, (totalProfit / ach.target) * 100);
            else if (ach.isStreak) progress = Math.min(100, (maxStreak / ach.target) * 100);
            else progress = Math.min(100, (count / ach.target) * 100);
            
            const isDone = progress >= 100;
            
            html += `
                <div class="ach-card ${isDone ? '' : 'locked'}">
                    <div class="ach-icon ${isDone ? 'done' : 'locked'}">${ach.icon}</div>
                    <div class="ach-title">${ach.title}</div>
                    <div class="ach-desc">${ach.desc}</div>
                    <div class="ach-progress">
                        <div class="ach-fill" style="width: ${progress}%"></div>
                    </div>
                    <div class="ach-status ${isDone ? 'done' : 'progress'}">
                        ${isDone ? 'Выполнено' : Math.round(progress) + '%'}
                    </div>
                </div>
            `;
        });
        
        html += `</div>`;
        document.getElementById('achievements').innerHTML = html;
    }

    // Start
    window.onload = load;
</script>
</html>
