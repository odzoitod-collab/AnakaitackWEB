
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRL Team • Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --bg-sec: #060608;
            --text: #e8e8ec;
            --hint: #7a7a85;
            --accent: #b8b8c8;
            --accent-bright: #d4af37;
            --metal: linear-gradient(145deg, #2a2a30 0%, #1a1a1e 50%, #0e0e10 100%);
            --metal-border: 1px solid rgba(184, 184, 200, 0.12);
            --metal-shine: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 50%);
            --card-bg: #121216;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 16px;
            --green: #4ade80;
            --red: #f87171;
            --orange: #fb923c;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Exo 2', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { font-family: var(--font-body); background: var(--bg-sec); color: var(--text); padding-bottom: 90px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
        
        .icon { width: 20px; height: 20px; stroke-width: 2px; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke: currentColor; }
        .icon-sm { width: 16px; height: 16px; }
        .icon-lg { width: 24px; height: 24px; }

        .header { background: var(--card-bg); padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 50; border-bottom: var(--metal-border); }
        .header-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-sec); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--hint); flex-shrink: 0; border: 2px solid rgba(184,184,200,0.2); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3); }
        .header-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .header-info { flex: 1; min-width: 0; }
        .header-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
        .header-role { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: 0.08em; }
        
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,12,0.95); display: flex; justify-content: space-around; padding: 10px 6px 30px; border-top: var(--metal-border); z-index: 100; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--hint); font-size: 10px; font-weight: 600; padding: 4px 12px; border-radius: 12px; transition: 0.2s; border: none; background: none; cursor: pointer; width: 64px; font-family: var(--font-body); }
        .nav-item svg { width: 24px; height: 24px; transition: 0.2s; }
        .nav-item.active { color: var(--accent-bright); text-shadow: 0 0 20px rgba(212,175,55,0.3); }
        .nav-item.active svg { transform: translateY(-2px); stroke: var(--accent-bright); }

        /* Views */
        .view { display: none; padding: 16px; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; border: var(--metal-border); }
        .card::before { content: ''; position: absolute; inset: 0; background: var(--metal-shine); pointer-events: none; border-radius: inherit; }
        .hero-card { background: var(--metal); color: var(--text); padding: 24px; border: 1px solid rgba(212,175,55,0.25); box-shadow: 0 0 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03); }
        .hero-card .label { color: var(--hint); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.15em; }
        .hero-card .value { font-family: var(--font-display); font-size: 36px; font-weight: 900; letter-spacing: 0.02em; margin: 8px 0 20px; color: var(--accent-bright); text-shadow: 0 0 30px rgba(212,175,55,0.2); }
        
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .mini-stat { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 14px; border: var(--metal-border); display: flex; flex-direction: column; justify-content: space-between; }
        .mini-stat-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--hint); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .mini-stat .v { font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1.2; color: var(--text); }

        .section-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; margin: 24px 4px 12px; display: flex; align-items: center; justify-content: space-between; letter-spacing: 0.08em; color: var(--text); text-transform: uppercase; }
        
        .chart-wrapper { height: 220px; width: 100%; position: relative; margin-top: 10px; }
        
        /* Leaderboard */
        .search-box { position: sticky; top: 0; background: var(--bg-sec); padding: 0 0 12px; z-index: 10; }
        .search-inner { position: relative; }
        .search-input { width: 100%; background: var(--card-bg); border: var(--metal-border); padding: 14px 44px 14px 16px; border-radius: 14px; font-size: 15px; color: var(--text); transition: 0.2s; -webkit-appearance: none; }
        .search-input:focus { border-color: rgba(212,175,55,0.4); box-shadow: 0 0 0 2px rgba(212,175,55,0.1); }
        .search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--hint); pointer-events: none; display: flex; }

        .user-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card-bg); border-radius: 14px; margin-bottom: 8px; transition: transform 0.1s; cursor: pointer; border: var(--metal-border); }
        .user-row:active { transform: scale(0.98); border-color: rgba(212,175,55,0.2); }
        
        .rank { width: 36px; min-width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--hint); font-size: 13px; font-family: var(--font-display); flex-shrink: 0; }
        .rank svg.rank-icon { width: 28px; height: 28px; display: block; flex-shrink: 0; }
        .rank-icon.rank-1 { color: #d4af37; filter: drop-shadow(0 1px 3px rgba(212,175,55,0.4)); }
        .rank-icon.rank-2 { color: #b0b0b8; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25)); }
        .rank-icon.rank-3 { color: #b87333; filter: drop-shadow(0 1px 3px rgba(184,115,51,0.35)); }
        
        .u-info { flex: 1; min-width: 0; }
        .u-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
        .u-tag { font-size: 12px; color: var(--hint); }
        .u-amount { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--accent-bright); white-space: nowrap; letter-spacing: 0.02em; }

        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: var(--metal-border); }
        .history-item:last-child { border-bottom: none; }
        .h-left { display: flex; gap: 14px; align-items: center; }
        .h-icon { width: 40px; height: 40px; border-radius: 12px; background: rgba(212,175,55,0.08); color: var(--accent-bright); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(212,175,55,0.15); }
        .h-meta { display: flex; flex-direction: column; gap: 2px; }
        .h-service { font-weight: 600; font-size: 15px; color: var(--text); }
        .h-date { font-size: 12px; color: var(--hint); }
        .h-right { text-align: right; }
        .h-amount { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; color: var(--green); }
        .h-user { font-size: 12px; color: var(--hint); font-weight: 500; }

        /* Profile Bottom Sheet */
        .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px); }
        .sheet-overlay.open { opacity: 1; pointer-events: auto; }
        .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-radius: 24px 24px 0 0; z-index: 201; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); height: 90vh; overflow-y: auto; display: flex; flex-direction: column; border: 1px solid rgba(184,184,200,0.12); border-bottom: none; box-shadow: 0 -8px 32px rgba(0,0,0,0.5); }
        .sheet.open { transform: translateY(0); }
        .sheet-header { padding: 8px; display: flex; justify-content: center; position: sticky; top: 0; background: var(--bg-sec); z-index: 10; }
        .sheet-handle { width: 40px; height: 5px; background: var(--hint); opacity: 0.3; border-radius: 10px; margin: 8px 0; }
        .sheet-close { position: absolute; right: 16px; top: 16px; background: rgba(128,128,128,0.1); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); transition: 0.2s; }
        .sheet-close:active { background: rgba(128,128,128,0.2); }

        .profile-hero .p-name { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: 0.02em; color: var(--text); margin-bottom: 4px; }
        .profile-hero .p-tag { color: var(--hint); font-size: 14px; font-weight: 500; }
        .profile-stat-box { background: rgba(0,0,0,0.3); padding: 16px; border-radius: 14px; display: flex; align-items: center; gap: 12px; border: var(--metal-border); }
        .stat-icon { width: 36px; height: 36px; border-radius: 10px; background: rgba(212,175,55,0.1); color: var(--accent-bright); display: flex; align-items: center; justify-content: center; border: 1px solid rgba(212,175,55,0.2); }

        .loader { position: fixed; inset: 0; background: var(--bg); z-index: 999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; transition: opacity 0.3s; }
        .spinner { width: 44px; height: 44px; border: 3px solid var(--card-bg); border-top-color: var(--accent-bright); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .filter-chip { background: var(--card-bg); color: var(--hint); border: var(--metal-border); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; font-family: var(--font-body); cursor: pointer; transition: 0.2s; }
        .filter-chip.active { background: linear-gradient(135deg, rgba(212,175,55,0.25) 0%, rgba(212,175,55,0.1) 100%) !important; color: var(--accent-bright) !important; border: 1px solid rgba(212,175,55,0.3); }

    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-avatar" id="myAvatar"></div>
        <div class="header-info">
            <div class="header-name" id="myName">Загрузка...</div>
            <div class="header-role">
                <span id="myStatus">...</span>
            </div>
        </div>
        <div id="connectionStatus" style="width: 8px; height: 8px; background: #34C759; border-radius: 50%; box-shadow: 0 0 8px #34C759;"></div>
    </div>

    <!-- VIEW: Overview -->
    <div id="view-overview" class="view active">
        <div class="card hero-card">
            <div class="label">Общий профит команды</div>
            <div class="value" id="totalTeamProfit">0 ₽</div>
            <div class="stats-row">
                <div class="mini-stat">
                    <div class="mini-stat-header">
                        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <span>За сегодня</span>
                    </div>
                    <div class="v" id="todayTeamProfit">0 ₽</div>
                </div>
                <div class="mini-stat">
                    <div class="mini-stat-header">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
                        <span>Рекорд</span>
                    </div>
                    <div class="v" id="maxProfit">0 ₽</div>
                </div>
            </div>
        </div>

        <div class="section-title">
            <span>Динамика</span>
            <div style="display:flex; align-items:center; gap:6px;">
                 <span style="font-size: 13px; color: var(--hint); font-weight:400">7 дней</span>
            </div>
        </div>
        <div class="card">
            <div style="margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px;">
                <span style="font-size: 24px; font-weight: 700; color: var(--text);" id="chartTotal">0 ₽</span>
            </div>
            <div class="chart-wrapper">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="section-title">
            По сервисам
            <span style="font-size: 13px; font-weight: 400; color: var(--hint);">Топ 5</span>
        </div>
        <div class="card">
            <div style="height: 200px; display: flex; align-items: center; justify-content: center;">
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>

    <!-- VIEW: Leaderboard -->
    <div id="view-leaderboard" class="view">
        <div class="search-box">
            <div class="search-inner">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск по нику или тегу...">
                <div class="search-icon">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
            </div>
        </div>
        
        <div style="display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch;">
            <button class="filter-chip active" onclick="setLbFilter('all', this)">Все время</button>
            <button class="filter-chip" onclick="setLbFilter('month', this)">Месяц</button>
            <button class="filter-chip" onclick="setLbFilter('day', this)">Сегодня</button>
        </div>

        <div id="leaderboardList"></div>
    </div>

    <!-- VIEW: History -->
    <div id="view-history" class="view">
        <div class="section-title">Лента выплат</div>
        <div class="card" id="globalHistoryList" style="min-height: 300px;"></div>
    </div>

    <!-- PROFILE SHEET -->
    <div class="sheet-overlay" id="sheetOverlay" onclick="closeProfile()"></div>
    <div class="sheet" id="profileSheet">
        <div class="sheet-header">
            <div class="sheet-handle"></div>
            <button class="sheet-close" onclick="closeProfile()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div style="padding: 0 16px 40px;">
            <div class="card profile-hero" style="text-align: center; padding: 24px 20px; margin-bottom: 12px;">
                <div id="p-name" class="p-name">Name</div>
                <div id="p-tag" class="p-tag">@tag</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px;">
                    <div class="profile-stat-box">
                        <div class="stat-icon">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M12 20V10"></path><path d="M18 20V4"></path><path d="M6 20v-4"></path></svg>
                        </div>
                        <div style="text-align: left;">
                            <div style="font-size: 12px; color: var(--hint);">Профитов</div>
                            <div id="p-count" style="font-size: 17px; font-weight: 700;">0</div>
                        </div>
                    </div>
                    <div class="profile-stat-box">
                        <div class="stat-icon" style="color: var(--green); background: rgba(52, 199, 89, 0.15);">
                            <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                        </div>
                        <div style="text-align: left;">
                            <div style="font-size: 12px; color: var(--hint);">Сумма</div>
                            <div id="p-total" style="font-size: 17px; font-weight: 700; color: var(--green);">0 ₽</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-title">Активность</div>
            <div class="card">
                <!-- Убрали горизонтальный скролл, сделали график адаптивным -->
                <div style="height: 220px; width: 100%;">
                    <canvas id="profileChart"></canvas>
                </div>
            </div>

            <div class="section-title">История</div>
            <div class="card" id="p-history" style="padding-top: 0; padding-bottom: 0;"></div>
        </div>
    </div>

    <!-- Navbar -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchView('overview', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Обзор
        </button>
        <button class="nav-item" onclick="switchView('leaderboard', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
            Топ
        </button>
        <button class="nav-item" onclick="switchView('history', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg>
            История
        </button>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <div style="font-size: 15px; font-weight: 600; color: var(--hint); margin-top: 8px;">Синхронизация данных...</div>
    </div>

    <script>
        // --- CONFIG ---
        const SUPABASE_URL = 'https://sqoehqvvrbbgaqvkniyw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxb2VocXZ2cmJiZ2FxdmtuaXl3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2Njk4OTM4NSwiZXhwIjoyMDgyNTY1Mzg1fQ.aGsql2VZ_l_71JQgUfxmjSMEVoLxqiu3sWhTJMTj3oc';
        
        let db;
        try { db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) { console.error("DB Error", e); }

        const tg = window.Telegram?.WebApp;
        if(tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0a0a0c'); tg.setBackgroundColor('#060608');
        }

        // --- STATE ---
        const state = {
            userId: tg?.initDataUnsafe?.user?.id || 0,
            userPhoto: tg?.initDataUnsafe?.user?.photo_url,
            userName: tg?.initDataUnsafe?.user?.first_name || 'Guest',
            users: [],
            profits: [],
            userMap: {},
            lbFilter: 'all',
            charts: {}
        };

        // --- HELPERS ---
        const fmtMoney = n => new Intl.NumberFormat('ru-RU').format(Math.floor(Number(n))) + ' ₽';
        const getInitials = n => (n||'??').replace(/[^a-zA-Zа-яА-Я ]/g, "").split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
        function toMoscowDate(isoStr) {
            const d = new Date(isoStr);
            return d.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit', year: 'numeric' });
        }
        function toMoscowDateKey(isoStr) {
            const d = new Date(isoStr);
            const y = d.toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', year: 'numeric' });
            const m = d.toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', month: '2-digit' });
            const day = d.toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit' });
            return day + '.' + m + '.' + y;
        }
        function getTodayMoscow() {
            return new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Moscow' });
        }
        function getMoscowDayStart(isoStr) {
            const d = new Date(isoStr);
            const s = d.toLocaleString('en-CA', { timeZone: 'Europe/Moscow' });
            return s.slice(0, 10);
        }
        const formatDate = dStr => {
            const d = new Date(dStr);
            const todayMoscow = getTodayMoscow();
            const dayMoscow = getMoscowDayStart(dStr);
            const time = d.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit' });
            if (dayMoscow === todayMoscow) return `Сегодня, ${time}`;
            return toMoscowDate(dStr) + ', ' + time;
        };

        const getUserName = (u, id) => {
            if (!u) return `ID: ${id}`;
            return u.full_name || u.username || u.user_tag || `ID: ${u.id}`;
        };

        // Генерация аватара с фоллбеком
        const getAvatarHTML = (url, name) => {
            if (url) {
                // Добавляем onerror, чтобы если ссылка битая, показывались инициалы
                return `<img src="${url}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" style="width:100%;height:100%;object-fit:cover"><div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;background:var(--bg-sec);color:var(--hint);font-weight:700;">${getInitials(name)}</div>`;
            }
            return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--hint)">${getInitials(name)}</div>`;
        };

        // --- FETCHING ---
        async function fetchAllUsers() {
            let allUsers = [];
            let from = 0;
            const step = 999;
            let fetching = true;

            while(fetching) {
                const { data, error } = await db.from('users').select('*').range(from, from + step);
                if (error || !data || data.length === 0) {
                    fetching = false;
                } else {
                    allUsers = allUsers.concat(data);
                    if (data.length < step + 1) fetching = false;
                    from += step + 1;
                }
            }
            return allUsers;
        }

        async function init() {
            if(!db) return;
            const uData = await fetchAllUsers();
            const { data: pData } = await db.from('profits').select('*').order('created_at', { ascending: false }).range(0, 9999);

            state.users = uData || [];
            state.profits = pData || [];
            state.users.forEach(u => state.userMap[u.id] = u);

            renderApp();
            
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 300);
        }

        function renderApp() {
            const myUser = state.userMap[state.userId] || { full_name: state.userName, photo_url: state.userPhoto };
            const myName = getUserName(myUser, state.userId);
            const avatarUrl = state.userPhoto || myUser.photo_url;
            
            document.getElementById('myName').innerText = myName;
            document.getElementById('myStatus').innerText = (myUser.status || 'active').toUpperCase();
            document.getElementById('myAvatar').innerHTML = getAvatarHTML(avatarUrl, myName);
            
            const total = state.profits.reduce((acc, p) => acc + Number(p.amount), 0);
            const todayMoscow = getTodayMoscow();
            const today = state.profits
                .filter(p => getMoscowDayStart(p.created_at) === todayMoscow)
                .reduce((acc, p) => acc + Number(p.amount), 0);
            const maxP = state.profits.reduce((max, p) => Math.max(max, Number(p.amount)), 0);

            document.getElementById('totalTeamProfit').innerText = fmtMoney(total);
            document.getElementById('todayTeamProfit').innerText = fmtMoney(today);
            document.getElementById('maxProfit').innerText = fmtMoney(maxP);

            renderTeamChart();
            renderPieChart();
            renderLeaderboard();
            renderGlobalHistory();
        }

        // --- LEADERBOARD ---
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', () => renderLeaderboard());

        function setLbFilter(filter, btn) {
            state.lbFilter = filter;
            document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboardList');
            const term = searchInput.value.toLowerCase().trim();

            const todayMoscow = getTodayMoscow();
            const monthMoscow = new Date().toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', month: '2-digit', year: 'numeric' });
            const agg = {};
            state.profits.forEach(p => {
                const dayKey = getMoscowDayStart(p.created_at);
                let pass = true;
                if (state.lbFilter === 'month') {
                    const pMonth = new Date(p.created_at).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow', month: '2-digit', year: 'numeric' });
                    if (pMonth !== monthMoscow) pass = false;
                }
                if (state.lbFilter === 'day' && dayKey !== todayMoscow) pass = false;
                if (pass) {
                    if (!agg[p.worker_id]) agg[p.worker_id] = 0;
                    agg[p.worker_id] += Number(p.amount);
                }
            });

            let list = [];
            if (term.length > 0) {
                list = state.users.filter(u => {
                    const name = (u.full_name || '').toLowerCase();
                    const username = (u.username || '').toLowerCase();
                    const tag = (u.user_tag || '').toLowerCase();
                    const id = String(u.id);
                    return name.includes(term) || username.includes(term) || tag.includes(term) || id.includes(term);
                }).map(u => ({ id: u.id, user: u, total: agg[u.id] || 0 })).sort((a,b) => b.total - a.total);
            } else {
                list = Object.keys(agg).map(id => ({ id: id, user: state.userMap[id], total: agg[id] })).sort((a,b) => b.total - a.total).slice(0, 100); 
            }

            if(list.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--hint); display:flex; flex-direction:column; align-items:center; gap:10px;"><svg class="icon" viewBox="0 0 24 24" style="width:40px;height:40px;opacity:0.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span>${term ? 'Ничего не найдено' : 'Нет данных за период'}</span></div>`;
                return;
            }

            container.innerHTML = list.map((item, idx) => {
                const rank = idx + 1;
                const u = item.user;
                const id = item.id;
                
                let rankDisplay = `<span style="opacity:0.75">#${rank}</span>`;
                if (state.lbFilter === 'all' && !term) {
                    if (rank === 1) rankDisplay = `<svg class="rank-icon rank-1" viewBox="0 0 32 32" fill="currentColor"><path d="M16 4h-2v5H9v5c0 2.8 2.2 5 5 5h4c2.8 0 5-2.2 5-5V9h-5V4h-2zm0 12c-1.7 0-3-1.3-3-3v-2h6v2c0 1.7-1.3 3-3 3zm-3 4h6v1.5h-6zm1 2.5h4v1h-4z"/></svg>`;
                    if (rank === 2) rankDisplay = `<svg class="rank-icon rank-2" viewBox="0 0 32 32"><circle cx="16" cy="14" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="16" cy="14" r="5" fill="currentColor"/><path d="M16 3v2.5M16 22.5V25M6 14H3.5M28.5 14H26M9.5 7.5L7.5 9.5M24.5 20.5l2 2M24.5 7.5l2-2M9.5 20.5l-2 2" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>`;
                    if (rank === 3) rankDisplay = `<svg class="rank-icon rank-3" viewBox="0 0 32 32"><circle cx="16" cy="14" r="9" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="16" cy="14" r="5" fill="currentColor"/><path d="M16 3v2.5M16 22.5V25M6 14H3.5M28.5 14H26M9.5 7.5L7.5 9.5M24.5 20.5l2 2M24.5 7.5l2-2M9.5 20.5l-2 2" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>`;
                }
                
                const displayName = getUserName(u, id);
                const tag = u ? (u.username ? '@'+u.username : (u.user_tag ? '#'+u.user_tag : '')) : '';
                
                return `
                <div class="user-row" onclick="openProfile('${id}')">
                    <div class="rank">${rankDisplay}</div>
                    <div class="u-info">
                        <div class="u-name">${displayName}</div>
                        <div class="u-tag">${tag || '—'}</div>
                    </div>
                    <div class="u-amount">${fmtMoney(item.total)}</div>
                </div>
                `;
            }).join('');
        }

        // --- GLOBAL HISTORY ---
        function renderGlobalHistory() {
            const list = document.getElementById('globalHistoryList');
            const recent = state.profits.slice(0, 50);
            
            list.innerHTML = recent.map(p => {
                const icon = `<svg class="icon-lg" viewBox="0 0 24 24"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>`;
                
                return `
                <div class="history-item">
                    <div class="h-left">
                        <div class="h-icon">${icon}</div>
                        <div class="h-meta">
                            <div class="h-service">${p.service_name}</div>
                            <div class="h-date">${formatDate(p.created_at)}</div>
                        </div>
                    </div>
                    <div class="h-right">
                        <div class="h-amount" style="color:var(--green)">+${fmtMoney(p.amount)}</div>
                    </div>
                </div>`;
            }).join('');
        }

        // --- PROFILE SHEET ---
        function openProfile(id) {
            const u = state.userMap[id];
            const uProfits = state.profits.filter(p => p.worker_id == id);
            const total = uProfits.reduce((a,b) => a + Number(b.amount), 0);

            const displayName = getUserName(u, id);
            
            document.getElementById('p-name').innerText = displayName;
            const tag = u ? (u.username ? '@'+u.username : (u.user_tag ? '#'+u.user_tag : `ID: ${id}`)) : `ID: ${id}`;
            document.getElementById('p-tag').innerText = tag;
            document.getElementById('p-total').innerText = fmtMoney(total);
            document.getElementById('p-count').innerText = uProfits.length;

            // History
            document.getElementById('p-history').innerHTML = uProfits.slice(0, 20).map(p => `
                <div class="history-item">
                    <div class="h-left">
                        <div class="h-meta">
                            <div class="h-service">${p.service_name}</div>
                            <div class="h-date">${formatDate(p.created_at)}</div>
                        </div>
                    </div>
                    <div class="h-right">
                        <div class="h-amount">+${fmtMoney(p.amount)}</div>
                    </div>
                </div>
            `).join('');

            // Draw Chart
            renderProfileChart(uProfits);

            // Open Sheet
            document.getElementById('sheetOverlay').classList.add('open');
            document.getElementById('profileSheet').classList.add('open');
        }

        function closeProfile() {
            document.getElementById('sheetOverlay').classList.remove('open');
            document.getElementById('profileSheet').classList.remove('open');
        }

        // --- CHARTS (все даты по Москве) ---
        function getLast7DaysMoscow() {
            const todayStr = getTodayMoscow();
            const [y, m, d] = todayStr.split('-').map(Number);
            const labels = [];
            const dayKeys = [];
            for (let i = 6; i >= 0; i--) {
                const dayAgo = new Date(y, m - 1, d - i);
                const key = dayAgo.getFullYear() + '-' + String(dayAgo.getMonth() + 1).padStart(2, '0') + '-' + String(dayAgo.getDate()).padStart(2, '0');
                dayKeys.push(key);
                labels.push(dayAgo.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: '2-digit' }));
            }
            return { labels, dayKeys };
        }

        function renderTeamChart() {
            const ctx = document.getElementById('mainChart');
            const { labels, dayKeys } = getLast7DaysMoscow();
            const days = {};
            dayKeys.forEach(k => { days[k] = 0; });

            let weekTotal = 0;
            state.profits.forEach(p => {
                const dayKey = getMoscowDayStart(p.created_at);
                if (days.hasOwnProperty(dayKey)) {
                    days[dayKey] += Number(p.amount);
                    weekTotal += Number(p.amount);
                }
            });

            const values = dayKeys.map(k => days[k]);
            document.getElementById('chartTotal').innerText = fmtMoney(weekTotal);

            if (state.charts.main) state.charts.main.destroy();
            const grad = ctx.getContext('2d').createLinearGradient(0, 0, 0, 220);
            grad.addColorStop(0, 'rgba(212,175,55,0.3)');
            grad.addColorStop(1, 'rgba(212,175,55,0)');
            state.charts.main = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Профит',
                        data: values,
                        borderColor: '#d4af37',
                        backgroundColor: grad,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 4,
                        pointBackgroundColor: '#121216',
                        pointBorderColor: '#d4af37',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#7a7a85', font: { size: 11, family: 'Exo 2' }, maxTicksLimit: 7 } },
                        y: { beginAtZero: true, border: { display: false }, grid: { color: 'rgba(184,184,200,0.08)' }, ticks: { color: '#7a7a85', font: { size: 10 } } }
                    }
                }
            });
        }

        function renderProfileChart(data) {
            const ctx = document.getElementById('profileChart');
            const historyMap = {};
            data.forEach(p => {
                const k = toMoscowDateKey(p.created_at);
                historyMap[k] = (historyMap[k] || 0) + Number(p.amount);
            });
            const sorted = Object.entries(historyMap).sort((a, b) => {
                const [d1, m1, y1] = a[0].split('.').map(Number);
                const [d2, m2, y2] = b[0].split('.').map(Number);
                const t1 = new Date(y1, m1 - 1, d1).getTime();
                const t2 = new Date(y2, m2 - 1, d2).getTime();
                return t1 - t2;
            });
            const last14 = sorted.slice(-14);
            const labels = last14.map(x => x[0]);
            const values = last14.map(x => x[1]);

            if(state.charts.profile) state.charts.profile.destroy();
            
            // Создаем градиент
            const gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(212,175,55,0.25)');
            gradient.addColorStop(1, 'rgba(212,175,55,0)');

            state.charts.profile = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        borderColor: '#d4af37',
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 3,
                        pointBackgroundColor: '#121216',
                        pointBorderColor: '#d4af37',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { intersect: false, mode: 'index' } },
                    scales: {
                        x: { 
                            grid: { display: false }, 
                            ticks: { maxTicksLimit: 6, color: '#7a7a85', font: { size: 10, family: 'Exo 2' } } 
                        },
                        y: { beginAtZero: true, border: { display: false }, grid: { color: 'rgba(184,184,200,0.08)' }, ticks: { display: false } }
                    }
                }
            });
        }

        function renderPieChart() {
            const ctx = document.getElementById('pieChart');
            const map = {};
            state.profits.forEach(p => map[p.service_name] = (map[p.service_name]||0) + Number(p.amount));
            const sorted = Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0,5);

            if(state.charts.pie) state.charts.pie.destroy();
            state.charts.pie = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: sorted.map(x=>x[0]),
                    datasets: [{
                        data: sorted.map(x=>x[1]),
                        backgroundColor: ['#d4af37', '#4ade80', '#fb923c', '#f87171', '#a78bfa'],
                        borderColor: '#121216',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: 10 },
                    plugins: { 
                        legend: { position: 'right', labels: { boxWidth: 10, usePointStyle: true, font: { size: 11, family: 'Exo 2' }, color: '#7a7a85' } } 
                    }
                }
            });
        }

        // --- NAVIGATION ---
        window.switchView = (viewName, btn) => {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById('view-'+viewName).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
        };

        window.onload = init;

    </script>
</body>
</html>
